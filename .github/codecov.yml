coverage:
  status:
    project:
      default:
        target: auto       # ベースコミットのカバレッジを目標にする
        threshold: 2       # 2%までの低下は許容する
    patch:
      default:
        target: auto
        threshold: 2

ignore:
  - "frontend/dist/**/*"
  - "frontend/wailsjs/**/*"
  - "build/**/*"
  - "main.go"              # wails.Run など自動テストが困難なエントリーポイント
  - "app_dialogs.go"       # ダイアログ操作などテスト困難なUI
  - "app_fonts.go"         # システム環境依存のフォント取得
