name: Wails Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: ExifFrame-linux-amd64.tar.gz
          - os: windows-2022
            artifact: ExifFrame-windows-amd64.exe
          - os: macos-14
            artifact: ExifFrame-macos-arm64.zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails v3 CLI and Task
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.96
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Generate Bindings
        shell: bash
        run: wails3 generate bindings

      - name: Build Frontend
        shell: bash
        run: |
          cd frontend
          npm run build

      - name: Build Application
        shell: bash
        run: go build -tags production -trimpath -buildvcs=false -ldflags="-w -s" -o bin/ExifFrame

      - name: Update Assets (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i.bak -e "s/\${VERSION:-0.0.1}/$VERSION/" build/config.yml
          wails3 task common:update:build-assets

      - name: Package macOS App
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p bin/ExifFrame.app/Contents/MacOS
          mkdir -p bin/ExifFrame.app/Contents/Resources
          cp build/darwin/icons.icns bin/ExifFrame.app/Contents/Resources/
          cp bin/ExifFrame bin/ExifFrame.app/Contents/MacOS/
          cp build/darwin/Info.plist bin/ExifFrame.app/Contents/
          codesign --force --deep --sign - bin/ExifFrame.app
          cd bin
          ditto -c -k --keepParent ExifFrame.app ExifFrame-macos-arm64.zip

      - name: Package Windows App
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd bin
          mv ExifFrame ExifFrame-windows-amd64.exe || mv ExifFrame.exe ExifFrame-windows-amd64.exe

      - name: Package Linux App
        if: runner.os == 'Linux'
        run: |
          cd bin
          tar czf ExifFrame-linux-amd64.tar.gz ExifFrame

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bin/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true