name: Wails Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: ExifFrame-linux-amd64.tar.gz
          - os: windows-latest
            artifact: ExifFrame.exe
          - os: macos-latest
            artifact: ExifFrame-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails App
        run: wails build

      - name: Package macOS App
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          zip -r ExifFrame-macos-arm64.zip *.app

      - name: Package Linux App
        if: runner.os == 'Linux'
        run: |
          cd build/bin
          tar czf ExifFrame-linux-amd64.tar.gz ExifFrame

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/${{ matrix.artifact }}