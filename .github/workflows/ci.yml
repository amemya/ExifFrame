name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.x'
        cache: true

    - name: Install Wails Dependencies (Linux)
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config

    - name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install Wails v3 CLI
      run: |
        go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.96
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Generate Bindings
      run: wails3 generate bindings

    - name: Frontend Build & Test
      working-directory: ./frontend
      run: |
        npm install
        npm run build
        npm run test:coverage

    - name: Backend Build & Test (Go)
      run: |
        go test -v ./...
        go build -v ./...
