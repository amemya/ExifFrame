name: Test

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.x'
        cache: true

    - name: Install Wails Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

    - name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install Wails v3 CLI
      run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.96

    - name: Generate Bindings
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          wails3 generate bindings -f "-tags gtk3"
        else
          wails3 generate bindings
        fi

    - name: Frontend Build & Test
      working-directory: ./frontend
      run: |
        npm install
        npm run build
        npm run test:coverage

    - name: Upload Frontend Coverage to Codecov
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: ./frontend/coverage
        flags: frontend
        name: frontend-coverage

    - name: Backend Build & Test (Go)
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          go test -tags gtk3 -v -coverprofile=coverage.txt -covermode=atomic ./...
          go build -tags gtk3 -v ./...
        else
          go test -v -coverprofile=coverage.txt -covermode=atomic ./...
          go build -v ./...
        fi

    - name: Upload Backend Coverage to Codecov
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.txt
        flags: backend
        name: backend-coverage
